name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/0.12.5/install.sh | sh
      - name: Run tests
        run: ~/.local/bin/uv run --frozen pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # No third-party actions touch the SSH key (SECURITY.md): plain ssh only.
    steps:
      - name: Deploy over SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
              "ubuntu@$VM_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/archon/app
          git fetch origin main
          git reset --hard origin/main
          ~/.local/bin/uv sync --frozen
          # ffmpeg is required for video sends (thumbnail/duration probe). A
          # deploy that leaves it missing means every /download silently fails.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg missing — installing"
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          fi
          command -v ffmpeg >/dev/null || { echo "ffmpeg still missing"; exit 1; }
          # Rebuild goneonize from source with our patches. This is BOTH the M5
          # security hardening (own audited .so, no runtime auto-download) AND
          # the WhatsApp view-once Android-identity spoof. `uv sync` just
          # reinstalled the prebuilt wheel .so, so this MUST run after it or the
          # view-once capture silently reverts to a stub on every deploy.
          sed -i 's/\r$//' deploy/build_goneonize.sh
          bash deploy/build_goneonize.sh
          sudo systemctl restart archon
          sleep 5
          systemctl is-active archon
          # Post-deploy live smoke: trigger the fast probe subset through the
          # test console and read the report back. It SKIPS cleanly (does not
          # fail the deploy) when probes are disabled or the test account is not
          # yet paired — it only fails the deploy on an explicit ❌.
          rm -f /opt/archon/data/cmd.result
          echo "live smoke" > /opt/archon/data/cmd.trigger
          SMOKE=""
          for _ in $(seq 1 30); do
            sleep 4
            [ -f /opt/archon/data/cmd.result ] || continue
            SMOKE=$(cat /opt/archon/data/cmd.result)
            case "$SMOKE" in running*|"") continue ;; esac
            break
          done
          echo "live smoke result: $SMOKE"
          case "$SMOKE" in
            *❌*) echo "post-deploy live smoke FAILED"; exit 1 ;;
            *) echo "live smoke ok/skipped" ;;
          esac
          REMOTE
