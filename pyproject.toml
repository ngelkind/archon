[project]
name = "archon"
version = "0.1.0"
description = "Personal AI assistant: WhatsApp/Telegram/Gmail -> Google Calendar, controlled via Telegram"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Telegram (Bot API incl. Business updates) — talks only to api.telegram.org
    "aiogram>=3.15",
    # Telegram MTProto userbot — talks only to Telegram DCs
    "telethon>=1.36",
    # WhatsApp (whatsmeow wrapper) — talks only to WhatsApp servers; pinned exactly,
    # goneonize is rebuilt from source on the VM (see SECURITY.md)
    "neonize==0.4.3.post0",
    # Google (official) — googleapis.com / accounts.google.com only
    "google-api-python-client>=2.198",
    "google-auth-oauthlib>=1.4",
    # LLM SDKs (official; the intended egress)
    "anthropic>=0.40",
    "openai>=1.55",
    "google-genai>=1.0",
    # Infrastructure
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    # Media downloads (YouTube/TikTok/Instagram/X/… ~1800 sites) — pure Python,
    # actively maintained. Needs ffmpeg on the host for some format merges.
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
# Claude Code subscription backend (spawns local `claude` subprocess)
claude-code = ["claude-agent-sdk>=0.1"]
# DuckDuckGo web search fallback (OFF by default; provider-native search preferred)
ddg = ["ddgs>=9.0"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
